name: CI

# Gates every change to main and every pull request. Four independent jobs so a
# failure names the layer that broke, and so a slow job does not hide a fast one.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (build, vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l ./apps ./pkg ./test 2>/dev/null)
          if [ -n "$out" ]; then
            echo "::error::gofmt needed on:"
            echo "$out"
            exit 1
          fi

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        # The two-agent demo is the acceptance test: it asserts neither agent's
        # transcript contains plaintext. It runs against in-process fakes, so no
        # services are needed here.
        run: go test ./... -count=1

      - name: conformance vectors
        # The frozen v1 formats are validated against their JSON Schemas. A
        # change that breaks the wire format must fail here, not in production.
        run: |
          python3 -m pip install --quiet jsonschema
          python3 - <<'PY'
          import json, sys
          import jsonschema

          pairs = [
              ("spec/capability-token/v1.schema.json", "spec/capability-token/v1.vectors.json"),
              ("spec/encrypted-folder/v1.schema.json", "spec/encrypted-folder/v1.vectors.json"),
          ]
          total = passed = 0
          failures = []
          for schema_path, vectors_path in pairs:
              validator = jsonschema.Draft202012Validator(json.load(open(schema_path)))
              for vector in json.load(open(vectors_path))["vectors"]:
                  total += 1
                  got = "valid" if not list(validator.iter_errors(vector["input"])) else "invalid"
                  if got == vector["expect"]["schema"]:
                      passed += 1
                  else:
                      failures.append(f"{schema_path}:{vector['id']} want {vector['expect']['schema']} got {got}")
          print(f"conformance vectors: {passed}/{total} pass")
          for f in failures:
              print(f"::error::{f}")
          sys.exit(1 if failures else 0)
          PY

  mcp:
    name: MCP server (typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mcp-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/mcp-server/package-lock.json

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: test
        # Covers the token-only tool contracts and asserts no source file
        # branches on a vendor runtime.
        run: npm test

      - name: build
        run: npm run build

  python:
    name: Python SDK (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet -e '.[dev]'

      - name: ruff
        run: ruff check safekeys tests

      - name: mypy
        run: mypy safekeys

      - name: pytest
        run: pytest -q

  usm:
    name: USM (validate, drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: install usm
        run: npm install --global @smithgray/usm

      - name: validate specs
        run: |
          fail=0
          while IFS= read -r f; do
            if ! usm validate "$f"; then fail=1; fi
          done < <(find .usm -name '*.usm' | sort)
          exit $fail

      - name: check
        run: usm check

      # Gate on generated-output drift. This was blocked until USM 0.8.1 fixed
      # two non-idempotency bugs we reported upstream (usm#32: generate appended
      # a trailing newline to AGENTS.md every run; usm#37: two generators wrote
      # docs/data/models.md, so --check compared against the wrong one). Both are
      # fixed, so a stale generated file is now a real failure worth failing on.
      - name: generate --check (no drift)
        run: usm generate --check

  deploy:
    name: Deployment (images, units, hardening)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The dev scripts share settings through scripts/lib/common.sh precisely
      # because they drifted once (demo.sh and dev-down.sh disagreed with
      # dev-up.sh about the socket path, so `make demo` could not find a running
      # sidecar). Shellcheck keeps that class of bug visible.
      - name: Shellcheck dev scripts
        run: shellcheck --severity=warning scripts/*.sh scripts/lib/*.sh

      # The systemd units must parse and resolve. This caught two real bugs
      # during development (StartLimit* in the wrong section, missing
      # ExecStart), so it is worth gating on.
      - name: Validate systemd units
        run: |
          # Create the users, groups, binaries, and credential paths the units
          # reference, so verify reports real unit errors rather than "user does
          # not exist" noise.
          for u in safekeys-sidecar safekeys-control-plane openbao; do
            sudo useradd --system --no-create-home "$u" 2>/dev/null || true
            sudo groupadd --system "$u" 2>/dev/null || true
          done
          sudo groupadd --system safekeys-socket 2>/dev/null || true
          for b in /usr/local/bin/safekeys-sidecar /usr/local/bin/safekeys-cp /usr/local/bin/bao; do
            sudo touch "$b"; sudo chmod +x "$b"
          done
          sudo mkdir -p /etc/safekeys/secrets /etc/openbao
          for f in vault-token control-plane-api-key database-url signing-key api-key; do
            sudo touch "/etc/safekeys/secrets/$f"
          done
          sudo touch /etc/openbao/openbao.hcl
          sudo mkdir -p /var/lib/safekeys /var/lib/openbao

          fail=0
          for unit in deploy/systemd/*.service; do
            echo "--- $unit"
            sudo systemd-analyze verify "$unit" || fail=1
          done
          exit $fail

      # Build both images and assert the least-privilege contracts directly on
      # the artefacts (contract least-privilege-containers).
      - name: Build images
        run: |
          docker build -f Dockerfile.control-plane -t safekeys-control-plane:ci .
          docker build -f Dockerfile.sidecar -t safekeys-sidecar:ci .

      - name: Images run non-root and carry no shell
        run: |
          fail=0
          for img in safekeys-control-plane:ci safekeys-sidecar:ci; do
            uid=$(docker image inspect "$img" --format '{{.Config.User}}')
            echo "$img user=$uid"
            case "$uid" in
              ""|"0"|"0:0"|"root"|"root:root")
                echo "::error::$img is configured to run as root"; fail=1 ;;
            esac
            if docker run --rm --entrypoint /bin/sh "$img" -c true 2>/dev/null; then
              echo "::error::$img contains a shell"; fail=1
            fi
          done
          exit $fail

      # The decisive check: prove the unit's confinement still permits the
      # operations the resolver performs (socket bind, fork/exec, file
      # injection). A hardening directive that breaks the workload is worse
      # than none, so this runs the real directives against a probe.
      - name: Verify hardening is compatible with the workload
        run: ./scripts/verify-hardening.sh

      - name: Validate production Compose
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/compose.prod.yml config --quiet
          echo "deploy/compose.prod.yml: valid"
          rm -f deploy/.env

